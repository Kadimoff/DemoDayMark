<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a47"/>
      <stop offset="70%" stop-color="#040d1a"/>
      <stop offset="100%" stop-color="#02050a"/>
    </radialGradient>
    <linearGradient id="neon-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg-glow)" stroke="#1e293b" stroke-width="6"/>

  <!-- Outer HUD Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-dasharray="6 8"/>

  <!-- Glowing Progress Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neon-ring)" stroke-width="22" stroke-linecap="round" stroke-dasharray="720 285" filter="url(#glow)"/>

  <!-- Inner HUD Disk -->
  <circle cx="256" cy="256" r="125" fill="#030814" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>

  <!-- Digital Clock / Timer Graphic -->
  <path d="M256 165 V256 L320 290" fill="none" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)"/>

  <!-- Micro Indicators -->
  <circle cx="256" cy="98" r="8" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="414" cy="256" r="8" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="256" cy="414" r="8" fill="#10b981" filter="url(#glow)"/>
  <circle cx="98" cy="256" r="8" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Badge 4D Text -->
  <text x="256" y="375" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">PITCH TIMER</text>
</svg>
