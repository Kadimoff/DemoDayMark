<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Nəticələr · munsif.im</title>
<link rel="icon" href="/favicon.svg">
<script type="module" src="/src/reveal.ts"></script>
</head>
<body class="rv">
<!-- Backdrop: Higgsfield-generated stage loop (poster image until the video can play) -->
<div class="rv-bg" aria-hidden="true">
  <video class="rv-bgv" id="bgv" muted loop playsinline preload="auto" poster="/reveal/stage.webp"><source src="/reveal/stage.mp4" type="video/mp4"></video>
  <div class="rv-bgshade"></div>
</div>
<canvas class="rv-fx" id="fx" aria-hidden="true"></canvas>

<header class="rv-head">
  <div class="rv-brand"><img class="rv-mark" src="/brand/munsif-mark-flat.svg" alt="munsif.im" width="34" height="34"><b id="ev"></b></div>
  <div class="rv-title" id="title">Nəticələr</div>
  <div class="rv-prog" id="prog" hidden><span class="rv-prog-bar"><i id="progBar"></i></span><span><b id="progN">0</b> / <span id="progT">0</span> yer açıqlanıb</span><span class="rv-manual" id="manual" hidden>Münsiflərin yekun qərarı</span></div>
</header>

<main class="rv-main" id="main" aria-live="polite"></main>

<!-- Lower places: each reveal (or group) is shown big, then flies into its tile -->
<div class="rv-spot" id="spot" hidden></div>

<!-- Top places (v3): first the big place number, then the name — calm, no suspense texts -->
<div class="rv-overlay" id="overlay" hidden>
  <div class="rv-vignette"></div>
  <div class="rv-ov">
    <div class="rv-ov-num" id="ovNum"></div>
    <div class="rv-ov-place" id="ovPlace"></div>
    <div class="rv-ov-name" id="ovName"></div>
    <div class="rv-ov-proj" id="ovProj"></div>
    <div class="rv-ov-score mono" id="ovScore"></div>
    <div class="rv-ov-break" id="ovBreak"></div>
  </div>
</div>

<footer class="rv-dock" id="dock">
  <span class="rv-toast" id="toast" hidden></span>
  <div class="rv-btns" id="btns"></div>
</footer>
</body>
</html>
