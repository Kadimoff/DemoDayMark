<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B0F19">
<title>Münsif paneli · Hakaton</title>
<link rel="icon" href="/favicon.svg">
<script>try{var t=localStorage.getItem("ij.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- Start the state request with the HTML, not after the scripts load: one round trip less on slow phones. -->
<script>window.__jstate=fetch("/api/juror/state",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})</script>
<script type="module" src="/src/juror.ts"></script>
</head>
<body class="app">
<header class="jhead" id="jhead"></header>
<main class="wrap narrow jmain" id="main"><p class="empty">Yüklənir…</p></main>
<div class="dock" id="dock" hidden></div>
</body>
</html>
