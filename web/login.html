<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0F19">
<title>Daxil ol · DemoDay</title>
<link rel="icon" href="/favicon.svg">
<script type="module" src="/src/login.ts"></script>
</head>
<body class="app">
<main class="login-wrap">
  <div class="login fade">
    <div class="mark">
      <span class="logo"><svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><path d="M33 9c7 9 13 15 13 26a14 14 0 0 1-28 0c0-6 3-11 7-14 0 5 2 9 6 10-1-8 0-15 2-22z" fill="#FF5722"/></svg></span>
      <div><b id="brand"><i>DemoDay</i></b><span>Koordinator girişi</span></div>
    </div>
    <div class="note" id="already" hidden style="margin-bottom:12px"></div>
    <div class="card pad-lg">
      <form id="form" novalidate>
        <div><label class="f" for="u">İstifadəçi adı</label><input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
        <div><label class="f" for="p">Şifrə</label><input type="password" id="p" name="password" autocomplete="current-password" required></div>
        <p class="err-t" id="err" role="alert"></p>
        <button class="btn primary lg" id="go" type="submit">Daxil ol</button>
      </form>
    </div>
    <div class="foot"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 14h2M14 18h2M18 18h2v2"/></svg>
      <span><b style="color:var(--fg)">Münsifsiniz?</b> Koordinatorun göstərdiyi QR kodu telefonunuzun kamerası ilə skan edin. Şifrə lazım deyil.</span></div>
  </div>
</main>
</body>
</html>
