<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0B14">
<title>Səhnə · munsif.im</title>
<link rel="icon" href="/favicon.svg">
<meta name="description" content="Təqdimatlarınız münsifim ilə qiymətləndirilir. Münsif balları, səhnə taymeri və prezentasiyalar bir yerdə.">
<meta property="og:site_name" content="munsif.im">
<meta property="og:title" content="munsif.im">
<meta property="og:description" content="Təqdimatlarınız münsifim ilə qiymətləndirilir.">
<meta property="og:image" content="https://munsif.im/brand/og-image.png">
<script type="module" src="/src/timer.ts"></script>
</head>
<body class="tp phase-pitch paused">
<canvas class="tp-canvas" id="warp" aria-hidden="true"></canvas>

<!-- munsif.im: presentation / website of the team on stage (the timer floats above it as a bubble) -->
<div class="st-view" id="stView" hidden>
  <div class="st-slides" id="stSlides"><div class="st-loading"><i></i><span>Prezentasiya yüklənir…</span></div></div>
  <div class="st-site" id="stSite" hidden>
    <iframe id="stFrame" title="Layihə saytı" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div class="st-qrcard" id="stQr" hidden><div class="st-qrimg"><img id="stQrImg" alt="QR"></div>
      <div><div class="st-eyebrow">LAYİHƏ SAYTI</div><h2 id="stQrTeam"></h2><div class="st-qrurl" id="stQrUrl"></div>
      <p>Bu sayt səhnə ekranında açılmır. Telefonla QR kodu skan edib baxın.</p></div></div>
    <div class="st-corner" id="stCorner" hidden><img id="stQrSmall" alt="QR"><span id="stHost"></span></div>
  </div>
</div>

<header class="tp-head">
  <img class="tp-mark" src="/brand/munsif-mark-flat.svg" alt="" width="24" height="24">
  <div class="tp-event" id="event">munsif.im</div>
  <div class="tp-pills" aria-hidden="true"><span id="pillPitch" class="on">3 dəq təqdimat</span><i>→</i><span id="pillQa">+2 dəq sual-cavab</span></div>
</header>

<main class="tp-stage">
  <div class="tp-dial" id="dial">
    <div class="tp-core" id="core">
      <div class="tp-ring r1"></div><div class="tp-ring r2"></div><div class="tp-ring r3"></div><div class="tp-ring r4"></div>
      <svg class="tp-hud" viewBox="0 0 500 500" role="img" aria-label="Taymer dairəsi">
        <defs>
          <path id="arcTop" d="M 52,250 A 198,198 0 1,1 448,250" />
          <path id="rim" d="M 250,26 A 224,224 0 1,1 249.9,26" />
          <radialGradient id="disc" cx="50%" cy="50%" r="50%">
            <stop offset="0%" class="disc-fill-1" />
            <stop offset="75%" class="disc-fill-2" />
            <stop offset="100%" class="disc-fill-3" />
          </radialGradient>
          <linearGradient id="ringGrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#D46BC4"/><stop offset="1" stop-color="#FFB020"/></linearGradient>
        </defs>
        <circle class="disc" cx="250" cy="250" r="176" fill="url(#disc)" stroke-width="1.5" />
        <circle class="ticks" cx="250" cy="250" r="190" fill="none" stroke-width="4" stroke-dasharray="2 10.43" />
        <circle class="track" cx="250" cy="250" r="176" fill="none" stroke-width="14" />
        <circle class="progress" id="ring" cx="250" cy="250" r="176" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="1105.84" stroke-dashoffset="0" />
        <text class="tp-banner" font-size="14.5"><textPath id="banner" href="#arcTop" startOffset="50%" text-anchor="middle">TƏQDİMAT • 3 DƏQİQƏ</textPath></text>
        <g class="tp-orbit"><text class="tp-rim"><textPath id="rimText" href="#rim" startOffset="0%"></textPath></text></g>
      </svg>
    </div>
    <!-- Outside the 3D core: the digits stay flat and readable while the dial tilts or spins. -->
    <div class="tp-readout">
      <span class="tp-badge" id="badge">Mərhələ 1 • Təqdimat</span>
      <div class="tp-digits" id="digits">03:00</div>
      <p class="tp-subtext" id="subtext">Sonra: +2 dəq sual-cavab</p>
      <div class="tp-bars" aria-hidden="true"><div><i class="bp" id="barPitch" style="width:100%"></i></div><div><i class="bq" id="barQa" style="width:100%"></i></div></div>
    </div>
  </div>
  <section class="tp-name" id="name" aria-live="polite">
    <b id="nameTeam">Komanda seçilməyib</b>
    <small id="nameProj"></small>
  </section>
</main>

<!-- presentation HUD -->
<div class="st-hud" id="stHud" hidden>
  <div class="st-hud-l"><img src="/brand/munsif-mark-flat.svg" alt="" width="34" height="34"><div><b id="hudTeam">munsif.im</b><span id="hudInfo"></span></div></div>
  <span class="st-pill" id="slidePill" hidden>1 / 1</span>
</div>

<div class="st-bubble hidden-b" id="bubble" aria-hidden="true">
  <svg viewBox="0 0 120 120" class="st-bring"><circle cx="60" cy="60" r="52" class="track"/><circle cx="60" cy="60" r="52" class="bar" id="bubbleBar"/></svg>
  <div class="st-bin"><div class="st-blabel" id="bLabel">TƏQDİMAT</div><div class="st-btime" id="bTime">0:00</div><div class="st-bteam" id="bTeam"></div></div>
  <div class="st-bpause" id="bPause" hidden>FASİLƏ</div>
</div>

<div class="st-intro" id="intro" hidden>
  <div class="st-intro-bg"></div>
  <div class="st-intro-in">
    <div class="st-intro-kicker">NÖVBƏTİ ÇIXIŞ</div>
    <div class="st-intro-logo" id="introLogo"></div>
    <h1 class="st-intro-name" id="introName"></h1>
    <p class="st-intro-project" id="introProject"></p>
    <div class="st-intro-members" id="introMembers"></div>
  </div>
  <div class="st-intro-count" id="introCount"></div>
</div>

<div class="st-finale" id="finale" hidden></div>

<!-- v4: no controls on the projector. Only small auto-hiding sound / fullscreen icons, and (admin session of this
     organisation only) slide arrows for a presentation clicker that also hide after 2 s. -->
<footer class="tp-dock" id="dock">
  <span class="tp-toast" id="tpToast" hidden></span>
  <div class="tp-btns" id="btns"></div>
</footer>
<div class="st-nav" id="stNav" hidden><button type="button" data-nav="-1" aria-label="Əvvəlki slayd">‹</button><button type="button" data-nav="1" aria-label="Növbəti slayd">›</button></div>

<div class="st-demo" id="demoBar" hidden>
  <span class="st-demo-tag">DEMO</span>
  <button class="st-dbtn primary" data-d="toggle">Başla</button>
  <button class="st-dbtn" data-d="last">Son 7 saniyə</button>
  <button class="st-dbtn" data-d="reset">Sıfırla</button>
  <button class="st-dbtn" data-d="prev" aria-label="Əvvəlki slayd">‹</button><button class="st-dbtn" data-d="next" aria-label="Növbəti slayd">›</button>
  <button class="st-dbtn" data-d="intro">Anons</button>
  <button class="st-dbtn" data-d="site">Sayt</button>
  <button class="st-dbtn" data-d="pdf">Slaydlar</button>
  <button class="st-dbtn" data-d="timer">Taymer</button>
</div>
</body>
</html>
