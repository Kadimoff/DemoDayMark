<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ignite Demo Day Jürisi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky stage bar (team on stage + shared timer) over three working views — juror scoring, live ranking, coordinator console. */
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --surface-2:#F4F5F9; --line:#DADEE8; --fg:#141722; --muted:#5D6376;
  --accent:#DD4F18; --accent-ink:#FFFFFF; --accent-soft:#FBE4D9; --gold:#B07F06; --silver:#7C8597; --bronze:#A35B2A;
  --ok:#1C8A57; --warn:#B26F12; --danger:#C2362A; --stage-bg:#141722; --stage-fg:#F3F4F8; --stage-alert:#FF7A5C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F15; --surface:#151821; --surface-2:#1B1F2B; --line:#2A2F3E; --fg:#ECEDF2; --muted:#9298AC;
  --accent:#FF6F36; --accent-ink:#170A04; --accent-soft:#3A1D11; --gold:#F1C24D; --silver:#B8C0D0; --bronze:#D68A55;
  --ok:#3CC489; --warn:#E9B04B; --danger:#FF6B5C; --stage-bg:#1E2332; --stage-fg:#ECEDF2; --stage-alert:#FF7A5C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D0F15; --surface:#151821; --surface-2:#1B1F2B; --line:#2A2F3E; --fg:#ECEDF2; --muted:#9298AC;
  --accent:#FF6F36; --accent-ink:#170A04; --accent-soft:#3A1D11; --gold:#F1C24D; --silver:#B8C0D0; --bronze:#D68A55;
  --ok:#3CC489; --warn:#E9B04B; --danger:#FF6B5C; --stage-bg:#1E2332; --stage-fg:#ECEDF2; --stage-alert:#FF7A5C; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.02em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface-2);padding:4px;border-radius:999px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.mode{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.mode.live::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.mode.local::before{background:var(--warn)}

/* Stage strip */
.stage{background:var(--stage-bg);color:var(--stage-fg)}
.stage .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.stage .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.stage .who{font-family:var(--f-display);font-weight:500;font-size:18px;min-width:0;text-wrap:balance}
.stage .who small{font-family:var(--f-body);font-size:13px;opacity:.7;margin-left:8px;font-weight:500}
.timer{margin-left:auto;display:flex;align-items:center;gap:10px}
.timer .t{font-family:var(--f-mono);font-weight:700;font-size:26px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.timer .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--stage-fg) 14%,transparent)}
.timer.warn .t{color:#F1B54A} .timer.over .t{color:var(--stage-alert);animation:blink 1s steps(2) infinite}
.timer .bar{width:90px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--stage-fg) 18%,transparent);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
@keyframes blink{50%{opacity:.35}}

main{padding-block:22px 120px}
.view[hidden]{display:none}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:22px;letter-spacing:-.005em}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.pill.hot{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.empty{color:var(--muted);text-align:center;padding:40px 16px}

/* Juror picker */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.pick button{text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;display:flex;flex-direction:column;gap:4px}
.pick button small{color:var(--muted);font-weight:500;font-size:12px}
.pick button:hover{border-color:var(--accent)}

/* Team chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;position:relative}
.chip .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.chip .done{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--surface);font-size:11px}
.chip .live{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}

/* Score form */
.teamhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.teamhead h2{font-size:26px}
.crit{padding:16px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.crit:first-child{border-top:0}
.crit .ch{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.crit .ch b{font-size:16px}
.crit .w{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.crit p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 0;font-family:var(--f-mono);font-weight:700;font-size:15px;transition:transform .12s ease,background .12s ease}
.scale button:hover:not(:disabled){border-color:var(--accent)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
.scale button.lo[aria-pressed="false"]{opacity:.85}
.bands{display:grid;grid-template-columns:3fr 3fr 2fr 2fr;gap:6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bands span{border-top:2px solid var(--line);padding-top:3px}
.bands span:nth-child(3){border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.bands span:nth-child(4){border-color:var(--accent)}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.dock .tot{display:flex;align-items:baseline;gap:6px}
.dock .tot b{font-family:var(--f-mono);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.dock .tot span{color:var(--muted);font-size:13px}
.dock .st{color:var(--muted);font-size:13px;min-width:0}
.dock .btn{margin-left:auto;padding:12px 22px;font-size:15px}

/* Results */
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface)}
.lb li:first-child{border-top:0}
.lb .rk{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--muted);text-align:center}
.lb li.r1 .rk{color:var(--gold)} .lb li.r2 .rk{color:var(--silver)} .lb li.r3 .rk{color:var(--bronze)}
.lb .nm{min-width:0}
.lb .nm b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .nm small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .track{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.lb .track i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lb li.r1 .track i{background:var(--gold)}
.lb .sc{text-align:right}
.lb .sc b{font-family:var(--f-mono);font-size:24px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.lb .sc small{color:var(--muted);font-size:12px;white-space:nowrap}
.lb li.none .sc b{color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.miss{color:var(--muted)}
td.heat{background:color-mix(in srgb,var(--accent) calc(var(--h) * 1%),transparent)}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:130px}
.kpi b{font-family:var(--f-mono);font-size:22px;display:block}
.kpi span{font-size:12px;color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--ok);transition:width .4s ease}
.lock{display:grid;place-items:center;text-align:center;gap:10px;padding:60px 16px}
.lock .ic{font-family:var(--f-display);font-size:40px;color:var(--accent)}

/* Coordinator */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tgrid button{padding:12px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);text-align:left;font-weight:600;font-size:13.5px;min-width:0}
.tgrid button small{display:block;font-family:var(--f-mono);color:var(--muted);font-size:11px}
.tgrid button span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tgrid button[aria-pressed="true"] small{color:inherit;opacity:.8}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle b{display:block;font-size:14.5px}
.toggle small{color:var(--muted);font-size:12.5px}
.sw{width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .18s ease}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
.ed{display:grid;gap:8px}
.ed .er{display:grid;gap:8px;align-items:center}
.ed.teams .er{grid-template-columns:28px minmax(0,1fr) minmax(0,1.2fr) 34px}
.ed.jur .er{grid-template-columns:28px minmax(0,1fr) 34px}
.ed.cr .er{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 70px 34px}
.ed .ix{font-family:var(--f-mono);color:var(--muted);font-size:12px;text-align:center}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;height:36px;color:var(--muted)}
.x:hover{color:var(--danger);border-color:var(--danger)}
.sum{font-family:var(--f-mono);font-size:13px}
.sum.bad{color:var(--danger)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.note b{color:var(--fg)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line))}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:all .25s ease;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fadeup .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:860px){.grid2,.cgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){
  .scale{grid-template-columns:repeat(5,minmax(0,1fr))}
  .bands{display:none}
  .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1;padding:6px 8px}
  .timer .bar{display:none}
  .stage .who{font-size:16px}
  .ed.teams .er{grid-template-columns:22px minmax(0,1fr) 34px}
  .ed.teams .er input.pj{grid-column:2/3}
  .ed.cr .er{grid-template-columns:minmax(0,1fr) 64px 34px}
  .ed.cr .er input.cd{grid-column:1/-1;order:5}
  .dock .tot b{font-size:24px}
  .teamhead h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>IGN<i>I</i>TE</b><span id="evName">Demo Day</span></div>
    <span class="mode" id="mode">Qoşulur…</span>
    <nav class="tabs" id="tabs" aria-label="Bölmələr">
      <button data-v="panel">Münsif paneli</button>
      <button data-v="results">Nəticələr</button>
      <button data-v="control" id="tabControl" hidden>Koordinator</button>
    </nav>
  </div>
</header>
<section class="stage" aria-live="polite">
  <div class="wrap">
    <div style="min-width:0">
      <div class="lbl">Səhnədə</div>
      <div class="who" id="stageWho">Komanda seçilməyib</div>
    </div>
    <div class="timer" id="timer" hidden>
      <span class="k" id="timerKind">Pitch</span>
      <span class="bar"><i id="timerBar" style="width:100%"></i></span>
      <span class="t" id="timerT">3:00</span>
    </div>
  </div>
</section>

<main class="wrap">
  <section class="view" id="v-panel"></section>
  <section class="view" id="v-results" hidden></section>
  <section class="view" id="v-control" hidden></section>
</main>
<div class="dock" id="dock" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const round = (n, d=2) => Math.round(n * 10**d) / 10**d;
const fmt1 = n => (n == null || isNaN(n)) ? "—" : n.toFixed(1);

const DEF_CRIT = [
  {id:"problem",  name:"Problem",                 desc:"Problem real və aktualdırmı? Kimin problemidir və nə qədər ağrılıdır?", w:15},
  {id:"solution", name:"Həll və dəyər təklifi",   desc:"Həll problemi birbaşa aradan qaldırırmı? Mövcud alternativlərdən nə ilə fərqlənir?", w:15},
  {id:"mvp",      name:"MVP / Demo",              desc:"Məhsul işləyirmi? Demo inandırıcıdırmı, texniki icra hansı səviyyədədir?", w:20},
  {id:"market",   name:"Bazar və rəqabət",        desc:"Hədəf seqment və bazar həcmi aydındırmı? Rəqiblər və onlardan fərq bilinirmi?", w:10},
  {id:"biz",      name:"Biznes model",            desc:"Necə gəlir əldə edəcək? Qiymət, satış kanalları və gəlir modeli məntiqlidirmi?", w:10},
  {id:"traction", name:"Validasiya və traction",  desc:"İstifadəçi, pilot, müştəri müsahibəsi, niyyət məktubu — real sübut varmı?", w:10},
  {id:"team",     name:"Komanda",                 desc:"Komanda bu işi həyata keçirə bilərmi? Bacarıqlar bir-birini tamamlayırmı?", w:10},
  {id:"pitch",    name:"Təqdimat və sual-cavab",  desc:"3 dəqiqəyə sığdımı, aydın və strukturlu idimi? Suallara dəqiq və inamlı cavab verdimi?", w:10},
];
const defaultCfg = () => ({
  event: "Ignite Demo Day", date: "29.10.2026",
  teams: Array.from({length:8}, (_, i) => ({id:"t"+(i+1), name:"Komanda "+(i+1), project:""})),
  jurors: Array.from({length:5}, (_, i) => ({id:"j"+(i+1), name:"Münsif "+(i+1)})),
  criteria: DEF_CRIT.map(c => ({...c})),
  current: null, phase: null, locked: false, revealed: false, updatedAt: 0
});
const normalize = d => {
  const c = Object.assign(defaultCfg(), JSON.parse(JSON.stringify(d || {})));
  if (!Array.isArray(c.teams)) c.teams = defaultCfg().teams;
  if (!Array.isArray(c.jurors)) c.jurors = defaultCfg().jurors;
  if (!Array.isArray(c.criteria) || !c.criteria.length) c.criteria = DEF_CRIT.map(x => ({...x}));
  return c;
};

/* ---------- state ---------- */
let cfg = defaultCfg();
let scores = {};               // docId -> {juror, team, s, total, note, at}
let mode = "connecting";       // connecting | db | local
let db = null, dl = null, isOwner = false, readOnly = false;

function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

const canControl = () => mode === "local" || isOwner;
const canSeeResults = () => canControl() || !!cfg.revealed;
const sid = (j, t) => j + "__" + t;

/* ---------- scoring math ---------- */
function calcTotal(s, crit = cfg.criteria){
  const sw = crit.reduce((a, c) => a + (+c.w || 0), 0) || 1;
  return round(crit.reduce((a, c) => a + (+s?.[c.id] || 0) * (+c.w || 0), 0) / sw * 10, 2);
}
const isComplete = (s, crit = cfg.criteria) => crit.every(c => +s?.[c.id] >= 1 && +s?.[c.id] <= 10);

function stats(){
  const crit = cfg.criteria;
  const tie = [...crit].sort((a, b) => b.w - a.w).map(c => c.id);
  const list = cfg.teams.map((t, i) => {
    const rows = cfg.jurors.map(j => ({j, r: scores[sid(j.id, t.id)]})).filter(x => x.r && isComplete(x.r.s));
    const totals = rows.map(x => calcTotal(x.r.s));
    const n = totals.length;
    const avg = n ? round(totals.reduce((a, b) => a + b, 0) / n, 2) : null;
    const per = {};
    crit.forEach(c => { per[c.id] = n ? round(rows.reduce((a, x) => a + (+x.r.s[c.id]), 0) / n, 2) : null; });
    return {t, i, n, avg, per, min: n ? Math.min(...totals) : null, max: n ? Math.max(...totals) : null, rows, totals};
  });
  const ranked = [...list].sort((a, b) => {
    if (a.avg == null && b.avg == null) return a.i - b.i;
    if (a.avg == null) return 1; if (b.avg == null) return -1;
    if (b.avg !== a.avg) return b.avg - a.avg;
    for (const id of tie) { if ((b.per[id] ?? 0) !== (a.per[id] ?? 0)) return (b.per[id] ?? 0) - (a.per[id] ?? 0); }
    return a.i - b.i;
  });
  let rank = 0, prev = null;
  ranked.forEach((x, k) => { if (x.avg == null) { x.rank = null; return; } rank = k + 1; x.rank = rank; prev = x; });
  const done = list.reduce((a, x) => a + x.n, 0);
  return {list, ranked, done, need: cfg.teams.length * cfg.jurors.length};
}

/* ---------- storage ---------- */
let cfgQ = Promise.resolve();
function saveCfg(patch){
  cfg = normalize({...cfg, ...patch, updatedAt: Date.now()});
  renderAll();
  const snap = JSON.parse(JSON.stringify(cfg));
  if (mode === "local") { lsSet("ignite.cfg", snap); broadcast(); return Promise.resolve(); }
  cfgQ = cfgQ.then(() => db.doc("config/main").set(snap)).catch(e => toast(errText(e)));
  return cfgQ;
}
const scoreQ = {};
function saveScore(id, data){
  if (mode === "local") { scores[id] = data; lsSet("ignite.scores", scores); broadcast(); renderAll(); return Promise.resolve(); }
  scoreQ[id] = (scoreQ[id] || Promise.resolve()).then(() => db.doc("scores/" + id).set(data));
  return scoreQ[id];
}
async function wipeScores(){
  const ids = Object.keys(scores);
  if (mode === "local") { scores = {}; lsSet("ignite.scores", {}); broadcast(); renderAll(); return; }
  for (const id of ids) { try { await db.doc("scores/" + id).delete(); } catch(e) { toast(errText(e)); return; } }
}
function errText(e){
  const c = e && e.code;
  if (c === "invalid_argument") { return "Yazmaq icazəniz yoxdur. Koordinatordan sizi Editor kimi dəvət etməsini istəyin."; }
  if (c === "quota_exceeded") return "Baza dolub. Köhnə qeydləri silin.";
  if (c === "resource_exhausted") return "Çox sürətli əməliyyat. Bir neçə saniyə gözləyib yenidən cəhd edin.";
  return "Yadda saxlanmadı. İnterneti yoxlayıb yenidən cəhd edin.";
}
let bc = null; try { bc = new BroadcastChannel("ignite-jury"); } catch(e){}
function broadcast(){ try { bc && bc.postMessage(1); } catch(e){} }
function startLocal(){
  mode = "local";
  cfg = normalize(lsGet("ignite.cfg") || defaultCfg());
  scores = lsGet("ignite.scores") || {};
  const reload = () => { cfg = normalize(lsGet("ignite.cfg") || defaultCfg()); scores = lsGet("ignite.scores") || {}; renderAll(); };
  window.addEventListener("storage", reload);
  if (bc) bc.onmessage = reload;
  renderAll();
}
async function connect(){
  let c = window.claude;
  for (let k = 0; !c && k < 15; k++) { await new Promise(r => setTimeout(r, 100)); c = window.claude; }
  if (!c || typeof c.use !== "function") { startLocal(); return; }
  const safe = p => Promise.resolve(p).catch(() => null);
  const [d, u, w] = await Promise.all([safe(c.use("db")), safe(c.use("user")), safe(c.use("downloads"))]);
  dl = w;
  if (u) { try { isOwner = !!(await u.isOwner()); } catch(e){} try { const cw = await u.can("data.write"); if (cw === false) readOnly = true; } catch(e){} }
  if (!d) { startLocal(); return; }
  db = d; mode = "db";
  db.doc("config/main").onSnapshot(s => {
    cfg = s.exists ? normalize(s.data()) : defaultCfg();
    renderAll();
  }, () => toast("Canlı bağlantı kəsildi. Səhifəni yeniləyin."));
  db.collection("scores").onSnapshot(qs => {
    const next = {}; qs.docs.forEach(d => { next[d.id] = d.data(); });
    scores = next; renderAll();
  }, () => toast("Canlı bağlantı kəsildi. Səhifəni yeniləyin."));
  renderAll();
}

/* ---------- toast ---------- */

/* ---------- routing ---------- */
function setView(v){

  if (v === "control") { setupDirty = false; setupDraft = null; }

  renderAll();
}

function tickTimer(){
  const box = $("#timer"), p = cfg.phase;
  if (!p || !p.startedAt) { box.hidden = true; return; }
  box.hidden = false;
  const left = p.dur - (Date.now() - p.startedAt) / 1000;
  const L = Math.max(0, Math.ceil(left));
  $("#timerT").textContent = left <= 0 ? "0:00" : `${Math.floor(L/60)}:${String(L%60).padStart(2,"0")}`;
  $("#timerKind").textContent = p.kind === "qa" ? "Sual-cavab" : "Pitch";
  $("#timerBar").style.width = Math.max(0, Math.min(100, left / p.dur * 100)) + "%";
  box.classList.toggle("warn", left > 0 && left <= 30);
  box.classList.toggle("over", left <= 0);
  const cv = $("#ctlTimer"); if (cv) cv.textContent = $("#timerT").textContent;
}
setInterval(tickTimer, 250);

  }

  const saved = scores[sid(jurorId, team.id)];

  if (!d || (!d.dirty && (saved?.at || 0) !== d.base)) {
    d = drafts[team.id] = {s: {...(saved?.s || {})}, note: saved?.note || "", dirty: false, base: saved?.at || 0};
  }
  const critSig = cfg.criteria.map(c => c.id + c.w + c.name).join("|");
  const key = ["form", jurorId, team.id, critSig, d.base, cfg.locked, me?.name, team.name, team.project].join("§");

  // chips are cheap: always refresh
  const chipsHtml = cfg.teams.map((t, i) => {

      <div class="card fade" style="margin-top:12px">

          <div class="crit">

function renderDock(){
  const dock = $("#dock");
  if (view !== "panel" || !jurorId) { dock.hidden = true; return; }
  const d = drafts[selTeam]; if (!d) { dock.hidden = true; return; }
  const filled = cfg.criteria.filter(c => +d.s[c.id] >= 1).length, all = cfg.criteria.length;
  const saved = scores[sid(jurorId, selTeam)];
  const total = calcTotal(d.s);
  let st, pill;
  if (cfg.locked) { st = "Qiymətləndirmə koordinator tərəfindən bağlanıb."; pill = `<span class="pill warn">Bağlıdır</span>`; }
  else if (d.dirty) { st = `${filled}/${all} kriteriya doldurulub · yadda saxlanmayıb`; pill = `<span class="pill hot">Dəyişiklik var</span>`; }
  else if (saved) { const t = new Date(saved.at); st = `Göndərilib · ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}. Dəyişmək üçün yenidən seçin.`; pill = `<span class="pill ok">Göndərilib</span>`; }
  else { st = `${filled}/${all} kriteriya doldurulub`; pill = `<span class="pill">Qiymətləndirilməyib</span>`; }
  const fs = $("#fstat"); if (fs) fs.innerHTML = pill;
  const can = !cfg.locked && d.dirty && filled === all && mode !== "connecting";
  dock.hidden = false;
  dock.innerHTML = `<div class="wrap">
    <div class="tot"><b>${filled ? total.toFixed(1) : "—"}</b><span>/ 100</span></div>
    <div class="st">${st}</div>
    <button class="btn primary" id="submit" ${can ? "" : "disabled"}>${saved ? "Yenilə" : "Göndər"}</button></div>`;
}
$("#v-panel").addEventListener("click", e => {
  const j = e.target.closest("[data-j]");
  if (j) { jurorId = j.dataset.j; lsSet("ignite.juror", jurorId); formKey = ""; selTeam = cfg.current || null; lastCurrent = cfg.current; renderAll(); return; }
  if (e.target.closest("#chgJ")) { jurorId = null; lsSet("ignite.juror", null); formKey = ""; renderAll(); return; }
  const chip = e.target.closest(".chip");
  if (chip) { selTeam = chip.dataset.t; formKey = ""; renderPanel(); window.scrollTo({top: 0, behavior: "smooth"}); return; }
  const b = e.target.closest(".scale button");
  if (b && !b.disabled) {
    const d = drafts[selTeam]; d.s[b.dataset.c] = +b.dataset.v; d.dirty = true;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    renderDock();
  }
});
$("#v-panel").addEventListener("input", e => {
  if (e.target.id === "note") { const d = drafts[selTeam]; d.note = e.target.value; d.dirty = true; renderDock(); }
});
$("#dock").addEventListener("click", async e => {
  if (!e.target.closest("#submit")) return;
  const d = drafts[selTeam]; if (!d || cfg.locked) return;
  if (!isComplete(d.s)) { toast("Bütün kriteriyalara bal verin."); return; }
  const btn = $("#submit"); btn.disabled = true; btn.textContent = "Göndərilir…";
  const s = {}; cfg.criteria.forEach(c => { s[c.id] = +d.s[c.id]; });
  const at = Date.now();
  const data = {juror: jurorId, team: selTeam, s, total: calcTotal(s), note: (d.note || "").slice(0, 2000), at};
  try {
    await saveScore(sid(jurorId, selTeam), data);
    d.dirty = false; d.base = at;
    if (mode === "db") scores[sid(jurorId, selTeam)] = data;
    toast("Qiymət göndərildi ✓");
    formKey = ""; renderAll();
  } catch(err) { toast(errText(err)); if (err?.code === "invalid_argument") readOnly = true; renderDock(); }

    });
  }

    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    try { await Promise.all(["700 40px Unbounded", "500 40px Unbounded", "400 20px Manrope", "600 20px Manrope", "700 20px Manrope", "700 20px 'JetBrains Mono'"].map(f => document.fonts.load(f, "Əə"))); } catch(e){}
    const S = stats(), crit = cfg.criteria;
    const W = 1240, H = 1754, M = 96, CW = W - 2 * M;
    const C = {ink:"#141722", mute:"#5D6376", line:"#DADEE8", head:"#F2F3F7", acc:"#DD4F18", gold:"#B07F06", soft:"#FBE4D9"};
    const pages = []; let ctx, y;
    const F = (w, s, fam) => `${w} ${s}px ${fam === "d" ? "Unbounded, Manrope, sans-serif" : fam === "m" ? "'JetBrains Mono', monospace" : "Manrope, sans-serif"}`;
    function page(){

      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); ctx.textBaseline = "alphabetic"; pages.push(cv); y = M;

        cols.forEach((c, i) => { hl[i].forEach((ln, k) => { const tw = ctx.measureText(ln).width; ctx.fillText(ln, c.a === "r" ? x + c.w - pad - tw : x + pad, y + 28 + k * 20); }); x += c.w; }); y += hh; };

        let x = M;

        ctx.fillStyle = C.line; ctx.fillRect(M, y + rh - 1, CW, 1); y += rh;
      });

    }

    ctx.fillStyle = C.mute; ctx.font = F(700, 16); ctx.fillText("IGNITE · DEMO DAY PROTOKOLU", M, y + 14);

    const jw = Math.floor((CW - 300 - 130) / Math.max(1, cfg.jurors.length));
    title("Münsif matrisi", "Hər xana münsifin komandaya verdiyi yekun bal");
    table([{t:"Komanda", w:300, f:F(600, 18)}, ...cfg.jurors.map(j => ({t:j.name, w:jw, a:"r", f:F(500, 17, "m")})), {t:"Orta", w:CW - 300 - jw * cfg.jurors.length, a:"r", f:F(700, 18, "m")}],
      S.list.map(x => [x.t.name, ...cfg.jurors.map(j => { const r = scores[sid(j.id, x.t.id)]; return r && isComplete(r.s) ? calcTotal(r.s).toFixed(1) : "—"; }), fmt1(x.avg)]));
    const cw = Math.floor((CW - 260 - 110) / Math.max(1, crit.length));
    title("Kriteriyalar üzrə orta bal", "1–10 şkalası; sütun başlığında kriteriyanın çəkisi");
    table([{t:"Komanda", w:260, f:F(600, 17)}, ...crit.map(c => ({t:`${c.name} ${c.w}%`, w:cw, a:"r", f:F(500, 16, "m")})), {t:"Yekun", w:CW - 260 - cw * crit.length, a:"r", f:F(700, 17, "m")}],
      S.ranked.map(x => [x.t.name, ...crit.map(c => x.per[c.id] == null ? "—" : x.per[c.id].toFixed(1)), fmt1(x.avg)]), {rh: 44});
    // comments
    const notes = []; cfg.teams.forEach(t => cfg.jurors.forEach(j => { const r = scores[sid(j.id, t.id)]; if (r && r.note && r.note.trim()) notes.push({t, j, n: r.note.trim()}); }));
    if (notes.length) {
      title("Münsiflərin şərhləri");
      let lastT = null;
      notes.forEach(o => {
        ctx.font = F(400, 17); const lines = wrap(o.n, CW - 40);
        need(lines.length * 26 + (o.t !== lastT ? 70 : 40));
        if (o.t !== lastT) { ctx.fillStyle = C.ink; ctx.font = F(700, 20); ctx.fillText(o.t.name, M, y + 22); y += 38; lastT = o.t; }
        ctx.fillStyle = C.acc; ctx.font = F(700, 14); ctx.fillText(o.j.name.toUpperCase(), M + 20, y + 14); y += 24;
        ctx.fillStyle = C.ink; ctx.font = F(400, 17); lines.forEach(l => { need(26); ctx.fillText(l, M + 20, y + 18); y += 26; }); y += 14;
      });
      y += 20;
    }
    // signatures
    need(80 + Math.ceil(cfg.jurors.length / 2) * 90);
    title("Münsiflərin imzası");
    cfg.jurors.forEach((j, i) => {
      const col = i % 2, x = M + col * (CW / 2 + 20), yy = y + Math.floor(i / 2) * 90;
      ctx.fillStyle = C.line; ctx.fillRect(x, yy + 44, CW / 2 - 40, 2);
      ctx.fillStyle = C.ink; ctx.font = F(600, 17); ctx.fillText(j.name, x, yy + 72);
    });
    pages.forEach((cv, i) => { const c2 = cv.getContext("2d"); c2.fillStyle = C.mute; c2.font = F(500, 14); c2.fillText(`${cfg.event} · ${cfg.date || ""}`, M, H - 50); const s = `${i + 1} / ${pages.length}`; c2.fillText(s, W - M - c2.measureText(s).width, H - 50); });
    const pdf = new window.jspdf.jsPDF({unit: "pt", format: "a4", compress: true});
    pages.forEach((cv, i) => { if (i) pdf.addPage(); pdf.addImage(cv.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 595.28, 841.89); });
    await offer(fileBase() + "_protokol.pdf", pdf.output("arraybuffer"));
  } catch(e) { toast("PDF hazırlanmadı. İnterneti yoxlayın."); }
  finally { if (b) { b.disabled = false; b.textContent = "PDF yüklə"; } }
}

/* ---------- boot ---------- */
function renderAll(){
  renderTop();
  if (view === "panel") renderPanel(); else $("#dock").hidden = true;
  if (view === "results") renderResults();
  if (view === "control") renderControl();
}
const h = (location.hash || "").slice(1);
view = ["panel","results","control"].includes(h) ? h : "panel";
document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.v === view ? "true" : "false"));
["panel","results","control"].forEach(n => { $("#v-" + n).hidden = n !== view; });
renderAll();
connect().then(() => { if (view === "control" && !canControl()) setView("panel"); });
})();
</script>
